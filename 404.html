<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting...</title>
    <script type="text/javascript">
      // GitHub Pages SPA fallback (standard technique: https://github.com/rafgraph/spa-github-pages)
      // GitHub Pages serves this file for any unknown path (e.g. a direct visit
      // to /about). It encodes that path into a query string and redirects to
      // index.html, which decodes it back (see matching script in index.html)
      // so React Router can render the right page.
      //
      // pathSegmentsToKeep = number of path segments that make up the repo
      // name on a project site (e.g. 1 for username.github.io/repo-name/).
      // Set to 0 if deploying to a custom domain or username.github.io root.
      var pathSegmentsToKeep = 1;

      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") + "/?/" +
        l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
        (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
